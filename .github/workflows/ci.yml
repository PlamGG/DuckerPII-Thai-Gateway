name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch transformers pythainlp sentencepiece protobuf tiktoken

      - name: Export Hugging Face IOB2 data
        run: |
          python scripts/export_hf_token_classification.py

      - name: Run Deterministic & Safety Unit Tests
        run: |
          pytest tests/test_dataset_invariants.py tests/test_pdpa_compliance.py tests/test_wangchanberta_pipeline.py -v
